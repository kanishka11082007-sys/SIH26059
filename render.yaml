services:
  - type: web
    name: polarnav
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: OPEN_WATERS_API_KEY
        sync: false
      - key: OPEN_METEO_API_KEY
        sync: false
