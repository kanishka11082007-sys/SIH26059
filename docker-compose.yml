version: "3.8"

services:
  # FastAPI Backend & AI Optimization Engine
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polarnav_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-}
      - OPEN_WATERS_API_KEY=${OPEN_WATERS_API_KEY:-}
      - OPEN_METEO_API_KEY=${OPEN_METEO_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - polarnav_network

  # Nginx Frontend Reverse Proxy (Optional separate UI service)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: polarnav_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - polarnav_network

networks:
  polarnav_network:
    driver: bridge
